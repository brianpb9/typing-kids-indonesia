<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Guru">
  <!-- soft bg -->
  <rect width="200" height="200" rx="28" fill="#E8F4FC"/>
  <!-- chalkboard -->
  <rect x="20" y="28" width="100" height="70" rx="8" fill="#2D6A4F"/>
  <rect x="26" y="34" width="88" height="50" rx="4" fill="#40916C"/>
  <!-- ABC on board -->
  <text x="70" y="68" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="28" font-weight="800" fill="#D8F3DC">ABC</text>
  <!-- chalk tray -->
  <rect x="28" y="86" width="84" height="6" rx="2" fill="#95D5B2"/>

  <!-- teacher body -->
  <ellipse cx="130" cy="175" rx="42" ry="18" fill="#74B9FF" opacity="0.35"/>
  <!-- dress / shirt -->
  <path d="M100 118 Q100 105 130 102 Q160 105 160 118 L168 175 L92 175 Z" fill="#6C5CE7"/>
  <!-- collar -->
  <path d="M118 112 L130 122 L142 112" fill="#A29BFE"/>
  <!-- head -->
  <circle cx="130" cy="78" r="32" fill="#FFDAB9"/>
  <!-- hair -->
  <path d="M100 78 Q100 42 130 40 Q160 42 160 78 Q155 55 130 52 Q105 55 100 78" fill="#5D4037"/>
  <ellipse cx="108" cy="85" rx="8" ry="14" fill="#5D4037"/>
  <ellipse cx="152" cy="85" rx="8" ry="14" fill="#5D4037"/>
  <!-- glasses -->
  <circle cx="118" cy="78" r="9" fill="none" stroke="#2D3436" stroke-width="2.5"/>
  <circle cx="142" cy="78" r="9" fill="none" stroke="#2D3436" stroke-width="2.5"/>
  <line x1="127" y1="78" x2="133" y2="78" stroke="#2D3436" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="118" cy="78" r="3" fill="#2D3436"/>
  <circle cx="142" cy="78" r="3" fill="#2D3436"/>
  <!-- smile -->
  <path d="M118 92 Q130 102 142 92" stroke="#E17055" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- arm + chalk -->
  <path d="M100 125 Q75 130 55 100" stroke="#FFDAB9" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="48" y="88" width="18" height="6" rx="2" fill="#FFF8F0" transform="rotate(-25 57 91)"/>
  <!-- book in other hand -->
  <rect x="155" y="130" width="28" height="22" rx="3" fill="#E74C3C"/>
  <rect x="158" y="133" width="22" height="16" rx="2" fill="#FFF8F0"/>
</svg>
